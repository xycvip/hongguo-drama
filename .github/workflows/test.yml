name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android TV APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            android/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install root build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Android dependencies
        working-directory: android
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Android tests
        working-directory: android
        run: |
          mkdir -p build/tv/assets
          npm test

      - name: Build and verify APK
        working-directory: android
        run: python3 build.py --tv
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload APK only
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-drama-android-tv-apk
          path: android/build/tv/hongguo-downloader-*-android-tv-dev.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
